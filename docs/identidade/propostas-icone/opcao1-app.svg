<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3440"/><stop offset="1" stop-color="#141720"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3C86B"/><stop offset="1" stop-color="#B8832A"/></linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.3" r="0.7"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/></filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="412" fill="#FFFFFF" opacity="0.04"/>
  </g>
  <!-- trilho (ferrolho) -->
  <g filter="url(#shadow)">
    <rect x="212" y="432" width="600" height="160" rx="80" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"/>
  </g>
  <!-- língua do ferrolho encaixada à esquerda -->
  <rect x="268" y="476" width="200" height="72" rx="36" fill="#0B0D12" opacity="0.55"/>
  <!-- pino de latão -->
  <circle cx="364" cy="512" r="96" fill="url(#brass)" filter="url(#shadow)"/>
  <circle cx="364" cy="512" r="96" fill="url(#shine)"/>
  <circle cx="364" cy="512" r="30" fill="#5A3E10" opacity="0.9"/>
</svg>
