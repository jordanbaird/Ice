<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#20242D"/><stop offset="1" stop-color="#0D0F14"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/></linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC2A8"/><stop offset="0.5" stop-color="#FF7A55"/><stop offset="1" stop-color="#FFB38F"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.5"/></filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="412" fill="#FFFFFF" opacity="0.03"/>
  </g>
  <!-- pílula (silhueta do notch) -->
  <g filter="url(#shadow)">
    <rect x="192" y="412" width="640" height="200" rx="100" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"/>
  </g>
  <!-- trinca luminosa -->
  <polygon points="498,380 548,380 526,644 476,644" fill="#FF7A55" opacity="0.75" filter="url(#glow)"/>
  <polygon points="502,404 538,404 520,620 484,620" fill="url(#ember)"/>
</svg>
